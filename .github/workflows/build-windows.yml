name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run pylint
        run: python -m pylint tlwatch.py

  build:
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build tlwatch.exe
        # --collect-all bundles each package's submodules *and* data files
        # (notably certifi's CA bundle) straight into the exe, so the result
        # is fully self-contained -- no pip install, no download, at the
        # point of use on a field laptop with no signal.
        run: >
          pyinstaller --onefile --console --name tlwatch
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import tkinter.font
          --hidden-import tkinter.colorchooser
          --hidden-import queue
          --collect-all httpx
          --collect-all httpcore
          --collect-all h2
          --collect-all hpack
          --collect-all hyperframe
          --collect-all certifi
          tlwatch.py

      - name: Smoke test the executable
        run: .\dist\tlwatch.exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlwatch-windows
          path: dist/tlwatch.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tlwatch.exe
          generate_release_notes: true
